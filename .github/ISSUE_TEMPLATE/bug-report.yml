name: Bug report
description: Report a problem with StatusPage Monitor
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What went wrong?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add integration with URL …
        2. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider
      description: Which provider / status page URL is affected?
      placeholder: "e.g. Instatus — https://status.example.com"

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "e.g. 2025.3.4"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: StatusPage Monitor version
      placeholder: "e.g. 2026.3.1"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        From Settings → System → Logs. Enable debug logging if possible:
        `custom_components.statuspage_monitor: debug`
      render: text
