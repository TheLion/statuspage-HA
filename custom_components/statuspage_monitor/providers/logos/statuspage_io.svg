<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Atlassian Statuspage – brand blue #0052CC -->
  <rect width="128" height="128" rx="24" fill="#0052CC"/>
  <!-- Stylised rising-bars icon (references the Statuspage bar-chart mark) -->
  <rect x="22" y="74" width="18" height="26" rx="3" fill="white" opacity="0.7"/>
  <rect x="46" y="56" width="18" height="44" rx="3" fill="white" opacity="0.85"/>
  <rect x="70" y="38" width="18" height="62" rx="3" fill="white"/>
  <!-- Checkmark overlay – "all systems operational" feel -->
  <polyline points="86,28 96,40 112,18" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
