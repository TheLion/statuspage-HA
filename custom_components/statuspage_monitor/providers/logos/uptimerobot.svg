  <!-- Simple robot face -->
  <rect x="28" y="36" width="72" height="56" rx="10" fill="none" stroke="white" stroke-width="7"/>
  <!-- Eyes -->
  <circle cx="48" cy="60" r="7" fill="white"/>
  <circle cx="80" cy="60" r="7" fill="white"/>
  <!-- Smile -->
