# Status Page Monitor – Lovelace example with Mushroom Cards
#
# Requirements:
#   - Mushroom Cards: https://github.com/piitaya/lovelace-mushroom
#     Install via HACS → Frontend → Mushroom
#
# Adapt all entity IDs below to match your integration.
# Entity IDs follow the pattern: sensor.<page_name>_<sensor_name>
# Example: status.claude.com → page name "Claude" → sensor.statuspage_claude_overall_status
#
# The integration exposes an icon_color attribute on every sensor.
# Use {{ state_attr(config.entity, 'icon_color') }} in any card's icon_color
# field – this works in both the GUI editor and raw YAML mode.
#
# Color mapping:
#   Operational / None            → green
#   Degraded Performance / Minor  → yellow
#   Partial Outage / Major        → orange
#   Major Outage / Critical       → red
#   Under Maintenance             → blue

# ---------------------------------------------------------------------------
# Dashboard card
# ---------------------------------------------------------------------------
type: vertical-stack
cards:

  # ── Overall status ────────────────────────────────────────────────────────
  - type: custom:mushroom-entity-card
    entity: sensor.statuspage_claude_overall_status
    icon_color: "{{ state_attr(config.entity, 'icon_color') }}"

  # ── Active incidents ──────────────────────────────────────────────────────
  - type: custom:mushroom-entity-card
    entity: sensor.statuspage_claude_active_incidents
    icon_color: >-
      {{ 'red' if states(config.entity) | int > 0 else 'green' }}

  # ── Scheduled maintenances ────────────────────────────────────────────────
  - type: custom:mushroom-entity-card
    entity: sensor.statuspage_claude_scheduled_maintenances
    icon_color: >-
      {{ 'blue' if states(config.entity) | int > 0 else 'green' }}

  # ── Components ────────────────────────────────────────────────────────────
  # icon_color reads the pre-computed color from the entity attribute –
  # no need to know the raw state values.

  - type: custom:mushroom-entity-card
    entity: sensor.statuspage_claude_api
    icon_color: "{{ state_attr(config.entity, 'icon_color') }}"

  - type: custom:mushroom-entity-card
    entity: sensor.statuspage_claude_claude_com
    icon_color: "{{ state_attr(config.entity, 'icon_color') }}"

  - type: custom:mushroom-entity-card
    entity: sensor.statuspage_claude_claude_ios_app
    icon_color: "{{ state_attr(config.entity, 'icon_color') }}"
